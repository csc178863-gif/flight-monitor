name: flight-monitor

on:
  schedule:
    - cron: "0 * * * *" # 每小時一次（UTC；GitHub 可能延遲 5-15 分，屬正常）
  workflow_dispatch:
    inputs:
      always_report:
        description: "強制推播目前最便宜的票（測試推播管線用）"
        type: boolean
        default: false

permissions:
  contents: write # 需要把 state.json 寫回 repo

concurrency:
  group: flight-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run monitor
        env:
          GMN_API_KEY: ${{ secrets.GMN_API_KEY }}
          ALWAYS_REPORT: ${{ github.event.inputs.always_report }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "chore: update price state [skip ci]" && git push)
